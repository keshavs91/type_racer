<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room - TypeRacer</title>
    <style>
        body {
            padding: 20px;
        }

        .paragraph-display {
            background-color: #ffffff;
            border: 2px solid #2c2c2c;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .paragraph-text {
            font-size: 18px;
            color: #2c2c2c;
            line-height: 1.6;
        }

        .basic-btn {
            background-color: #4f46e5;   /* Indigo */
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .basic-btn:hover {
            background-color: #4338ca;
        }
        .basic-btn:active {
            transform: scale(0.97);
        }
        .basic-btn:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
        }

        /* .input-section { */
        /*     position: relative; */
        /* } */
        /**/
        /* .input-label { */
        /*     font-size: 14px; */
        /*     color: #2c2c2c; */
        /*     margin-bottom: 8px; */
        /*     display: block; */
        /* } */
        /**/

        .text-input {
            width: 100%;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #2c2c2c;
            padding: 12px 0;
            font-size: 16px;
            color: #2c2c2c;
            outline: none;
            font-family: inherit;
        }
        .text-input:focus {
            border-bottom-color: #4a4a4a;
        }
        .text-input::placeholder {
            color: #999;
        }
        .text-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

        <div style="display:flex; flex-direction:column">
            <h1>Room Name: {{ room_name }}</h1>
            {{ room_name|json_script:"room-name" }}
            <div class="player-info">
                <h3>Players</h3>
                <ul id="players-list"><ul>
            </div>
            <div>
            </div>
            <div class="paragraph-display">
                <div style="display: flex; justify-content: flex-end;">
                    <span class="game-countdown">Not Started Yet</span>
                </div>
                <p class="paragraph-text"></p>
            </div>
            <div class="input-section">
                <label class="input-label">text input box</label>
                <input type="text" class="text-input" placeholder="">
            </div>
        </div>

    <script>
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins === 1) return '1 Min Ago';
            if (diffMins < 60) return `${diffMins} Mins Ago`;

            const diffHours = Math.floor(diffMins / 60);
            if (diffHours === 1) return '1 Hour Ago';
            if (diffHours < 24) return `${diffHours} Hours Ago`;

            return date.toLocaleString();
        }

        function renderPlayers(players, currentPlayer) {
            const playersList = document.getElementById('players-list');
            playersList.innerHTML = '';

            for (const userId of players) {
                const li = document.createElement('li');
                if (userId == currentPlayer) {
                    li.innerHTML = `
                        <span class='player-id' style='color: green;'>${userId}</span>
                    `
                } else {
                    li.innerHTML = `
                        <span class='player-id'>${userId}</span>
                    `
                }
                playersList.appendChild(li);
            }
        }

        function renderScores(scores) {
            const scoreList = document.getElementById('players-list');
            scoreList.innerHTML = '';

            for (const [user, stats] of Object.entries(scores)) {
                const li = document.createElement('li');

                li.innerHTML = `
                    <span class="score-user">${user}</span>
                    <span class="score-wpm">${stats.wpm ?? 0} WPM</span>
                    <span class="score-accuracy">${stats.accuracy ?? 0}%</span>
                `;

                scoreList.appendChild(li);
            }
        }

        function toggleInput(enable) {
            var inputElement = document.querySelector('.text-input');
            inputElement.disabled = !enable;
        }
        // get user from cookies
        const USER_ID = getCookie('guest_user_id');
        if (!USER_ID) {
            window.location.href = '/';
        }

        canStart = false;
        roomUsers = [];

        // Focus on input when page loads
        document.addEventListener('DOMContentLoaded', function() {
            toggleInput(false);
        });

        // connect to the room
        const ROOM_NAME = JSON.parse(document.getElementById('room-name').textContent);
        const playerSocket = new WebSocket('ws://' + window.location.host + '/ws/room/' + ROOM_NAME + '/');

        playerSocket.onopen = function () {
            console.log('onopen');
            playerSocket.send(JSON.stringify({
                event: "join", 
                data: {
                    user_id: USER_ID
                }
            }));
        };

        playerSocket.onmessage = function(e) {
            const socketData = JSON.parse(e.data);
            const event = socketData.event;
            const data = socketData.data;

            let interval = null;
            let intervalGameRuntime = null;

            console.log(event);
            console.log(data);

            if (event == 'players_update') {
                roomUsers = data.users;
                renderPlayers(data.users, USER_ID)

                canStart = data.can_start;
                if (canStart == false) {
                    const paragraphEl = document.querySelector('.paragraph-text');
                    paragraphEl.innerHTML = 'Waiting for all players to join. Once enough players countdown will start automatically';
                }
            } else if (event == 'game_start') {
                paragraphText = data.paragraph;
                const paragraphEl = document.querySelector('.paragraph-text');
                const gameCountdown = document.querySelector('.game-countdown');

                function updateCountdownGameRuntime() {
                    const targetTime = new Date(data.run_until);
                    const now = new Date().getTime();
                    const diff = targetTime - now;

                    if (diff <= 0) {
                        clearInterval(intervalGameRuntime);
                        toggleInput(false);
                        return;
                    }

                    const seconds = Math.floor((diff / 1000) % 60);
                    gameCountdown.textContent = `${seconds}`;
                }

                function updateCountdown() {
                    const targetTime = new Date(data.start_at);
                    const now = new Date().getTime();
                    const diff = targetTime - now;

                    if (diff <= 0) {
                        paragraphEl.textContent = '';
                        for (let char of paragraphText) {
                            const span = document.createElement('span');
                            // Make spaces visible
                            span.textContent = char;
                            paragraphEl.appendChild(span);
                        }
                        clearInterval(interval);
                        toggleInput(true);
                        updateCountdownGameRuntime();
                        const intervalGameRuntime = setInterval(updateCountdownGameRuntime, 1000);
                        return;
                    }

                    const seconds = Math.floor((diff / 1000) % 60);
                    paragraphEl.textContent = `${seconds}`;
                }

                updateCountdown(); // run immediately
                intervel = setInterval(updateCountdown, 1000);
            } else if (event == 'player_progress') {
                const paragraphEl = document.querySelector('.paragraph-text');
                const typedText = data.typed_text;
                const spans = paragraphEl.querySelectorAll('span');

                spans.forEach((span, index) => {
                    if (index < typedText.length) {
                        const expectedChar = span.textContent;
                        const typedChar = typedText[index];

                        if (typedChar === expectedChar) {
                            span.style.color = 'green';
                        } else {
                            span.style.color = 'red';
                        }
                    } else {
                        span.style.color = '#2c2c2c';
                    }
                });
            }
        };

        playerSocket.onclose = function(e) {
            toggleInput(false);
            console.error('Chat socket closed unexpectedly');
        };

        const inputBox = document.querySelector('.text-input');
        inputBox.addEventListener('input', function(e) {
            playerSocket.send(JSON.stringify({
                event: 'player_progress',
                data: {
                    user_id: USER_ID,
                    user_input: e.target.value
                }
            }));
        });

    </script>
</body>
